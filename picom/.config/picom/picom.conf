# picom — compositor (gives st its transparency, removes tearing)
backend = "glx";
vsync = true;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@",
  "_NET_WM_STATE@[*] = '_NET_WM_STATE_HIDDEN'"
];

# Background blur behind transparent windows (e.g. st)
blur: {
  method = "dual_kawase";
  strength = 5;
};
blur-background-frame = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@"
];

# Fading
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

# Rounded corners (rofi has its own)
corner-radius = 6;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'"
];

# Leave fullscreen games/video alone
unredir-if-possible = true;

detect-client-opacity = true;
detect-rounded-corners = true;
use-damage = true;
