; polybar — yomi colors
[colors]
bg      = #0F0F14
bg1     = #1A1A22
bg2     = #2A3038
fg      = #D8D8E0
fgdim   = #8A909A
red     = #F11A39
green   = #2DAC67
yellow  = #E1BA21
blue    = #2280CF
magenta = #D179A6
cyan    = #71A9D5

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 26pt
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2pt
padding-left = 0
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.bg2}
; text font, then nerd font for icons
font-0 = Inter:style=Medium:size=12;2
font-1 = FiraCode Nerd Font:size=13;2
font-2 = Noto Color Emoji:scale=12;2
modules-left = i3 xwindow
modules-center = date
modules-right = dnd pulseaudio memory cpu eth wlan
cursor-click = pointer
enable-ipc = true

; primary monitor gets the system tray
[bar/primary]
inherit = bar/main
modules-right = dnd pulseaudio memory cpu eth wlan tray

[module/tray]
type = internal/tray
tray-spacing = 6pt

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
label-focused = %name%
label-focused-background = ${colors.bg1}
label-focused-underline = ${colors.red}
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-foreground = ${colors.fgdim}
label-unfocused-padding = 2
label-visible = %name%
label-visible-underline = ${colors.bg2}
label-visible-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-padding = 2
label-mode = %mode%
label-mode-background = ${colors.magenta}
label-mode-foreground = ${colors.bg}
label-mode-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.fgdim}

[module/dnd]
; notification bell: blue = on, gray = do not disturb, yellow N = N waiting
type = custom/ipc
hook-0 = ~/.config/polybar/dnd.sh
initial = 1
click-left = ~/.config/polybar/dnd.sh toggle >/dev/null; polybar-msg action dnd hook 0

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.cyan}
label-muted = 󰝟 muted
label-muted-foreground = ${colors.fgdim}
click-right = pavucontrol
click-middle = ~/.config/i3/scripts/audio

[module/memory]
type = internal/memory
interval = 3
format-prefix = "mem "
format-prefix-foreground = ${colors.magenta}
label = %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "cpu "
format-prefix-foreground = ${colors.yellow}
label = %percentage%%

[module/eth]
type = internal/network
interface-type = wired
interval = 5
format-connected-prefix = "ip "
format-connected-prefix-foreground = ${colors.green}
label-connected = %local_ip%
format-disconnected =

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5
format-connected-prefix = "󰖩 "
format-connected-prefix-foreground = ${colors.green}
label-connected = %essid%
format-disconnected =

[module/date]
type = internal/date
interval = 1
date = %a %b %d
time = %H:%M
format-prefix = "󰥔  "
format-prefix-foreground = ${colors.blue}
label = %date%  %time%

[settings]
screenchange-reload = true
